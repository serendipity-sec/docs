name: pr-check

# docs는 사람별 브랜치에서 승인 없이 바로 머지합니다(팀-온보딩.md 5번). 막는 검사는 없고 권장 사항만 경고로 알립니다.
# merge commit 제목이 PR 제목이 되므로 제목 형식만 권장합니다. PR 제목은 신뢰할 수 없는 입력이라 env로만 넘깁니다.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 (권장)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|test|chore|experiment|ci|perf|build|style|revert)(\([^)]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::warning title=PR 제목::'docs: 3회차 회의록 추가'처럼 쓰면 main 기록이 읽기 쉬워집니다"
          fi
